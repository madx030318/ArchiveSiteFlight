<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive History</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #1f2937;
        }

        header {
            background-color: #1e293b;
            color: white;
            padding: 24px 40px;
        }

        header h1 {
            font-size: 28px;
        }

        .container {
            max-width: 1200px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .search-panel {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search-input {
            flex: 1;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 16px;
        }

        .search-button {
            padding: 14px 24px;
            border: none;
            border-radius: 6px;
            background-color: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .search-button:hover {
            background-color: #1d4ed8;
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .filter {
            flex: 1;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background-color: white;
            font-size: 15px;
        }

        .results {
            margin-top: 40px;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>

<body>

    <header>
        <h1>Archive History</h1>
    </header>

    <main class="container">

        <div class="search-panel">

            <input
                type="text"
                class="search-input"
                placeholder="Search archive..."
            >

            <button class="search-button">
                Search
            </button>

        </div>

        <div class="filters">

            <select class="filter">
                <option value="">Category</option>
                <option value="science">Science</option>
                <option value="history">History</option>
                <option value="economics">Economics</option>
            </select>

            <select class="filter">
                <option value="">Year</option>
                <option value="2026">2026</option>
                <option value="2025">2025</option>
                <option value="2024">2024</option>
            </select>

            <select class="filter">
                <option value="">Source</option>
                <option value="research">Research</option>
                <option value="government">Government</option>
                <option value="archive">Archive</option>
            </select>

        </div>

        <div class="results">
            <h2>Archive Results</h2>
            <p>Search results will appear here.</p>
        </div>

    </main>

</body>
</html>
